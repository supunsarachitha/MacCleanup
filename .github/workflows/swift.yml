name: Swift

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version
        working-directory: ${{ github.workspace }}

      - name: Build app
        run: |
          xcodebuild \
            -project "$GITHUB_WORKSPACE/MacCleanup.xcodeproj" \
            -scheme MacCleanup \
            -destination 'platform=macOS' \
            build
        working-directory: ${{ github.workspace }}

      - name: Run tests
        run: |
          xcodebuild \
            -project "$GITHUB_WORKSPACE/MacCleanup.xcodeproj" \
            -scheme MacCleanup \
            -destination 'platform=macOS' \
            test
        working-directory: ${{ github.workspace }}
